# Convenience: spin up only PostgreSQL so you don't have to install it.
#   docker compose up -d
# Then point the backend at it (this matches backend/.env.example).
services:
  db:
    image: postgres:16-alpine
    container_name: urj_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: urj
      POSTGRES_PASSWORD: urj
      POSTGRES_DB: urj_portal
    ports:
      - "5432:5432"
    volumes:
      - urj_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urj -d urj_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  urj_pgdata:
